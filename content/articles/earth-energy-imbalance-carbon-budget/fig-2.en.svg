<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <text x="24" y="44" font-size="20">Earth's energy imbalance (W/m²)</text>

  <line x1="110" y1="100" x2="760" y2="100" class="s-line" stroke-width="1"/>
  <line x1="110" y1="220" x2="760" y2="220" class="s-line" stroke-width="1"/>
  <line x1="110" y1="80" x2="110" y2="340" class="s-mid" stroke-width="2"/>
  <line x1="110" y1="340" x2="760" y2="340" class="s-mid" stroke-width="2"/>
  <text x="98" y="346" font-size="16" text-anchor="end" class="t-mid">0</text>
  <text x="98" y="226" font-size="16" text-anchor="end" class="t-mid">0.5</text>
  <text x="98" y="106" font-size="16" text-anchor="end" class="t-mid">1.0</text>
  <text x="435" y="402" font-size="16" text-anchor="middle" class="t-mid">measurement period</text>

  <g data-step="1">
    <rect x="170" y="236.8" width="120" height="103.2" class="f-mid"/>
    <text x="230" y="226" font-size="20" text-anchor="middle" class="t-mono">0.43</text>
    <text x="230" y="368" font-size="16" text-anchor="middle">1975–1994</text>
  </g>

  <g data-step="2">
    <rect x="380" y="126.4" width="120" height="213.6" class="f-fg"/>
    <text x="440" y="116" font-size="20" text-anchor="middle" class="t-mono">0.89</text>
    <text x="440" y="368" font-size="16" text-anchor="middle">2005–2024</text>
  </g>

  <g data-step="3">
    <rect x="590" y="102.4" width="120" height="237.6" class="f-acc"/>
    <text x="650" y="92" font-size="20" text-anchor="middle" class="t-acc">0.99</text>
    <text x="650" y="368" font-size="16" text-anchor="middle">2012–2024</text>
  </g>

  <g data-step="4">
    <text x="776" y="44" font-size="18" text-anchor="end" class="t-acc">i.e. 0.4% of the 235 absorbed</text>
  </g>
</svg>
