<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <text x="24" y="44" font-size="20">Budget carbone restant pour 1,5 °C (GtCO2)</text>

  <line x1="110" y1="170" x2="760" y2="170" class="s-line" stroke-width="1"/>
  <line x1="110" y1="270" x2="760" y2="270" class="s-line" stroke-width="1"/>
  <line x1="110" y1="80" x2="110" y2="370" class="s-mid" stroke-width="2"/>
  <line x1="110" y1="370" x2="760" y2="370" class="s-mid" stroke-width="2"/>
  <text x="98" y="376" font-size="16" text-anchor="end" class="t-mid">0</text>
  <text x="98" y="276" font-size="16" text-anchor="end" class="t-mid">50</text>
  <text x="98" y="176" font-size="16" text-anchor="end" class="t-mid">100</text>

  <line x1="290" y1="370" x2="290" y2="378" class="s-mid" stroke-width="2"/>
  <line x1="470" y1="370" x2="470" y2="378" class="s-mid" stroke-width="2"/>
  <line x1="650" y1="370" x2="650" y2="378" class="s-mid" stroke-width="2"/>
  <text x="110" y="398" font-size="16" text-anchor="middle" class="t-mid">2025</text>
  <text x="290" y="398" font-size="16" text-anchor="middle" class="t-mid">2027</text>
  <text x="470" y="398" font-size="16" text-anchor="middle" class="t-mid">2029</text>
  <text x="650" y="398" font-size="16" text-anchor="middle" class="t-mid">2031</text>
  <text x="776" y="430" font-size="16" text-anchor="end" class="t-mid">début de l'année</text>

  <g data-step="1">
    <circle cx="110" cy="110" r="7" class="f-fg"/>
    <text x="128" y="102" font-size="18">130 GtCO2 début 2025</text>
  </g>

  <g data-step="2">
    <path d="M110,110 L388.6,370" pathLength="1" fill="none" class="draw s-fg" stroke-width="4"/>
    <text x="286" y="316" font-size="18" text-anchor="end">−42 GtCO2 par an</text>
  </g>

  <g data-step="3">
    <circle cx="388.6" cy="370" r="8" class="f-acc"/>
    <text x="404" y="350" font-size="18" class="t-acc">épuisé début 2028</text>
  </g>

  <g data-step="4">
    <line x1="110" y1="110" x2="667" y2="370" class="s-mid" stroke-width="3" stroke-dasharray="10 8"/>
    <circle cx="667" cy="370" r="7" class="f-mid"/>
    <text x="776" y="222" font-size="18" text-anchor="end">émissions divisées par 2 :</text>
    <text x="776" y="248" font-size="18" text-anchor="end">épuisé début 2031</text>
  </g>
</svg>
