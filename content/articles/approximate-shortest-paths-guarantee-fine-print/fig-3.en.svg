<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390">
  <text x="24" y="36" font-size="19">Distances where the guarantee holds</text>
  <text x="24" y="64" font-size="16" class="t-mid">Example: k = log₂ n ≈ 20</text>
  <line x1="110" y1="310" x2="770" y2="310" class="s-mid" stroke-width="2"/>
  <line x1="110" y1="302" x2="110" y2="318" class="s-mid" stroke-width="2"/>
  <line x1="770" y1="302" x2="770" y2="318" class="s-mid" stroke-width="2"/>
  <text x="110" y="338" font-size="17" text-anchor="middle" class="t-mid">0</text>
  <text x="770" y="338" font-size="17" text-anchor="end" class="t-mid">30</text>
  <text x="440" y="372" font-size="17" text-anchor="middle" class="t-mid">True distance between two vertices (edges)</text>
  <text x="24" y="127" font-size="19">1996</text>
  <text x="24" y="227" font-size="19">2025</text>
  <g data-step="2">
    <rect x="550" y="100" width="220" height="40" class="f-panel s-fg" stroke-width="2"/>
    <text x="660" y="127" font-size="18" text-anchor="middle">guaranteed</text>
    <rect x="110" y="100" width="440" height="40" fill="none" class="s-mid" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="330" y="127" font-size="18" text-anchor="middle" class="t-mid">no guarantee</text>
    <line x1="550" y1="140" x2="550" y2="318" class="s-mid" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text x="550" y="338" font-size="17" text-anchor="middle">k = 20</text>
  </g>
  <g data-step="3">
    <rect x="205" y="200" width="565" height="40" class="f-panel s-acc" stroke-width="2.5"/>
    <text x="487" y="227" font-size="18" text-anchor="middle" class="t-acc">guaranteed</text>
    <line x1="205" y1="240" x2="205" y2="318" class="s-acc" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text x="205" y="338" font-size="17" text-anchor="middle" class="t-acc">~ log k</text>
  </g>
  <g data-step="4">
    <rect x="110" y="200" width="95" height="40" fill="none" class="s-mid" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="222" y="274" font-size="17" class="t-mid">← left over: very close pairs</text>
  </g>
</svg>
