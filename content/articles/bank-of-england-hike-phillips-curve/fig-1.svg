<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <text x="36" y="60" font-size="18">Inflation sur 12 mois (%)</text>
  <line class="s-fg" x1="100" y1="90" x2="100" y2="390" stroke-width="2"/>
  <line class="s-fg" x1="100" y1="390" x2="770" y2="390" stroke-width="2"/>
  <line class="s-line" x1="100" y1="190" x2="770" y2="190" stroke-width="1"/>
  <line class="s-line" x1="100" y1="90" x2="770" y2="90" stroke-width="1"/>
  <text class="t-mid" x="88" y="396" font-size="16" text-anchor="end">0</text>
  <text class="t-mid" x="88" y="296" font-size="16" text-anchor="end">2</text>
  <text class="t-mid" x="88" y="196" font-size="16" text-anchor="end">4</text>
  <text class="t-mid" x="88" y="96" font-size="16" text-anchor="end">6</text>
  <line class="s-mid" x1="100" y1="290" x2="770" y2="290" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="t-mid" x="772" y="281" font-size="16" text-anchor="end">cible 2 %</text>

  <g data-step="1">
    <rect class="f-mid" x="145" y="260" width="90" height="130"/>
    <text x="190" y="250" font-size="18" text-anchor="middle">2,6 %</text>
    <text class="t-mid" x="190" y="416" font-size="16" text-anchor="middle">juin 2026</text>
  </g>

  <g data-step="2">
    <rect class="f-mid" x="295" y="265" width="90" height="125"/>
    <text x="340" y="205" font-size="18" text-anchor="middle">3,5 %</text>
    <text class="t-mid" x="340" y="416" font-size="16" text-anchor="middle">sept. 2026</text>
  </g>
  <g data-step="2">
    <rect class="f-mid" data-hide="3" x="295" y="215" width="90" height="50"/>
  </g>

  <g data-step="3">
    <rect class="f-panel s-acc" x="296.500" y="216.500" width="87" height="48" stroke-width="3"/>
    <text class="t-acc" x="340" y="237" font-size="16" text-anchor="middle">énergie</text>
    <text class="t-acc" x="340" y="257" font-size="16" text-anchor="middle">≈ 1 point</text>
  </g>

  <g data-step="4">
    <rect class="s-acc" fill="none" x="446.500" y="166.500" width="87" height="222" stroke-width="3" stroke-dasharray="8 6"/>
    <text class="t-acc" x="490" y="155" font-size="18" text-anchor="middle">≈ 4,5 %</text>
    <text class="t-mid" x="490" y="416" font-size="16" text-anchor="middle">T1 2027</text>
    <rect class="s-acc" fill="none" x="596.500" y="141.500" width="87" height="247" stroke-width="3" stroke-dasharray="8 6"/>
    <text class="t-acc" x="640" y="130" font-size="18" text-anchor="middle">≈ 5 %</text>
    <text class="t-mid" x="640" y="416" font-size="16" text-anchor="middle">T2 2027</text>
    <text class="t-acc" x="565" y="80" font-size="16" text-anchor="middle">prévision de la Banque</text>
  </g>
</svg>
