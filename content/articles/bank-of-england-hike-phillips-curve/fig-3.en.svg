<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <g data-step="1">
    <rect class="f-panel s-mid" x="30" y="50" width="200" height="60" rx="6" stroke-width="2"/>
    <text x="130" y="86" font-size="18" text-anchor="middle">Energy costs more</text>
    <line class="s-fg" x1="230" y1="80" x2="310" y2="80" stroke-width="2"/>
    <polygon class="f-fg" points="308,73 308,87 320,80"/>
    <rect class="f-panel s-mid" x="320" y="50" width="240" height="60" rx="6" stroke-width="2"/>
    <text x="440" y="86" font-size="18" text-anchor="middle">Prices rise</text>
  </g>

  <g data-step="2">
    <line class="s-fg" x1="500" y1="110" x2="500" y2="200" stroke-width="2"/>
    <polygon class="f-fg" points="493,198 507,198 500,210"/>
    <text class="t-mid" x="514" y="166" font-size="16">expected prices rise</text>
    <rect class="f-panel s-mid" x="320" y="210" width="240" height="60" rx="6" stroke-width="2"/>
    <text x="440" y="246" font-size="18" text-anchor="middle">Wages rise</text>
  </g>

  <g data-step="3">
    <line class="s-acc" x1="380" y1="210" x2="380" y2="120" stroke-width="3"/>
    <polygon class="f-acc" points="373,122 387,122 380,110"/>
    <text class="t-acc" x="366" y="166" font-size="16" text-anchor="end">costs passed on</text>
  </g>

  <g data-step="4">
    <rect class="f-panel s-fg" x="30" y="320" width="260" height="60" rx="6" stroke-width="2"/>
    <text x="160" y="356" font-size="18" text-anchor="middle">Bank Rate: 4%</text>
    <path class="s-acc" fill="none" stroke-width="3" d="M290 350 H440 V282"/>
    <polygon class="f-acc" points="433,284 447,284 440,270"/>
    <text class="t-acc" x="456" y="340" font-size="16">slows this loop</text>
    <line class="s-mid" x1="130" y1="320" x2="130" y2="110" stroke-width="2" stroke-dasharray="6 6"/>
    <text class="t-mid" x="144" y="226" font-size="16">no effect here</text>
  </g>
</svg>
