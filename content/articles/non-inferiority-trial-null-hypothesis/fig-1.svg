    <text x="381" y="358" font-size="16" text-anchor="middle" class="t-acc">plafonnée à α</text>
  </g>

  <g data-step="4">
    <rect x="519" y="126" width="251" height="123" class="f-panel s-fg" stroke-width="2"/>
    <text x="644" y="165" font-size="19" text-anchor="middle">Erreur de 2e espèce</text>
    <text x="644" y="195" font-size="16" text-anchor="middle">bon produit bloqué</text>
    <text x="644" y="223" font-size="16" text-anchor="middle" class="t-mid">selon la taille de l'essai</text>
