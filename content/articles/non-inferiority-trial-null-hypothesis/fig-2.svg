<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- axe logarithmique : x = 80 + 461.66 * (ln(HR) + 0.6931), de 0,5 à 2 -->
  <line x1="80" y1="300" x2="720" y2="300" class="s-fg" stroke-width="2"/>
  <line x1="80" y1="300" x2="80" y2="308" class="s-fg" stroke-width="2"/>
  <line x1="267" y1="300" x2="267" y2="308" class="s-fg" stroke-width="2"/>
  <line x1="400" y1="300" x2="400" y2="308" class="s-fg" stroke-width="2"/>
  <line x1="507" y1="300" x2="507" y2="308" class="s-fg" stroke-width="2"/>
  <line x1="720" y1="300" x2="720" y2="308" class="s-fg" stroke-width="2"/>
  <text x="80" y="330" font-size="17" text-anchor="middle" class="t-mono">0,5</text>
  <text x="267" y="330" font-size="17" text-anchor="middle" class="t-mono">0,75</text>
  <text x="400" y="330" font-size="17" text-anchor="middle" class="t-mono">1</text>
  <text x="507" y="330" font-size="17" text-anchor="middle" class="t-mono">1,5</text>
  <text x="720" y="330" font-size="17" text-anchor="middle" class="t-mono">2</text>
  <text x="400" y="364" font-size="17" text-anchor="middle" class="t-mid">rapport de risque traités / placebo (échelle log)</text>

  <g data-step="1">
    <line x1="400" y1="104" x2="400" y2="300" class="s-mid" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="400" y="92" font-size="17" text-anchor="middle" class="t-mid">1 : même risque</text>
    <line x1="215" y1="210" x2="476" y2="210" class="s-fg" stroke-width="3"/>
    <line x1="215" y1="198" x2="215" y2="222" class="s-fg" stroke-width="3"/>
    <line x1="476" y1="198" x2="476" y2="222" class="s-fg" stroke-width="3"/>
    <circle cx="346" cy="210" r="8" class="f-fg"/>
    <text x="346" y="188" font-size="18" text-anchor="middle" class="t-mono">0,89</text>
    <text x="215" y="248" font-size="17" text-anchor="middle" class="t-mono">0,67</text>
    <text x="476" y="248" font-size="17" text-anchor="middle" class="t-mono">1,18</text>
  </g>

  <g data-step="2">
    <rect x="631" y="104" width="145" height="196" class="f-panel"/>
    <line x1="631" y1="104" x2="631" y2="300" class="s-fg" stroke-width="2"/>
    <text x="631" y="92" font-size="17" text-anchor="middle">seuil 1,65</text>
    <text x="704" y="140" font-size="18" text-anchor="middle">H0 :</text>
    <text x="704" y="166" font-size="18" text-anchor="middle">trop risqué</text>
  </g>

  <g data-step="3">
    <line x1="490" y1="210" x2="617" y2="210" class="s-acc" stroke-width="3"/>
    <path d="M 484 210 L 498 202 L 498 218 Z" class="f-acc"/>
    <path d="M 623 210 L 609 202 L 609 218 Z" class="f-acc"/>
    <text x="400" y="46" font-size="19" text-anchor="middle" class="t-acc">Question 1 : H0 rejetée, risque acceptable</text>
  </g>

  <g data-step="4">
    <line x1="400" y1="210" x2="476" y2="210" class="s-acc" stroke-width="7"/>
    <line x1="400" y1="104" x2="400" y2="300" class="s-acc" stroke-width="3"/>
    <text x="400" y="414" font-size="19" text-anchor="middle" class="t-acc">Question 2 : bénéfice non démontré</text>
  </g>
</svg>
