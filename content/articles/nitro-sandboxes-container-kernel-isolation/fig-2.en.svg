<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <text x="400" y="44" font-size="20" text-anchor="middle">Three containers on one machine</text>
  <rect x="60" y="80" width="200" height="70" class="f-panel s-fg"/>
  <text x="160" y="122" font-size="18" text-anchor="middle">Container A</text>
  <rect x="300" y="80" width="200" height="70" class="f-panel s-fg"/>
  <text x="400" y="122" font-size="18" text-anchor="middle">Container B</text>
  <rect x="540" y="80" width="200" height="70" class="f-panel s-fg"/>
  <text x="640" y="122" font-size="18" text-anchor="middle">Container C</text>
  <g data-hide="4">
    <g data-step="1">
      <line x1="160" y1="150" x2="160" y2="250" class="s-mid"/>
      <line x1="400" y1="150" x2="400" y2="250" class="s-mid"/>
      <line x1="640" y1="150" x2="640" y2="250" class="s-mid"/>
      <rect x="60" y="250" width="680" height="60" class="f-panel s-fg"/>
      <text x="400" y="287" font-size="18" text-anchor="middle">One shared Linux kernel</text>
    </g>
    <g data-step="2">
      <rect x="300" y="80" width="200" height="70" class="s-acc" fill="none" stroke-width="3"/>
      <line x1="400" y1="150" x2="400" y2="238" class="s-acc" stroke-width="3"/>
      <polygon points="392,236 408,236 400,250" class="f-acc"/>
      <text x="414" y="206" font-size="18" class="t-acc">hostile code</text>
    </g>
    <g data-step="3">
      <rect x="60" y="250" width="680" height="60" class="s-acc" fill="none" stroke-width="3"/>
      <line x1="160" y1="250" x2="160" y2="162" class="s-acc" stroke-width="3"/>
      <polygon points="152,164 168,164 160,150" class="f-acc"/>
      <text x="174" y="206" font-size="18" class="t-acc">exposed</text>
      <line x1="640" y1="250" x2="640" y2="162" class="s-acc" stroke-width="3"/>
      <polygon points="632,164 648,164 640,150" class="f-acc"/>
      <text x="654" y="206" font-size="18" class="t-acc">exposed</text>
    </g>
  </g>
  <g data-step="4">
    <line x1="160" y1="150" x2="160" y2="190" class="s-mid"/>
    <line x1="400" y1="150" x2="400" y2="190" class="s-mid"/>
    <line x1="640" y1="150" x2="640" y2="190" class="s-mid"/>
    <rect x="60" y="190" width="200" height="50" class="f-panel s-fg"/>
    <text x="160" y="222" font-size="18" text-anchor="middle">Kernel A</text>
    <rect x="300" y="190" width="200" height="50" class="f-panel s-fg"/>
    <text x="400" y="222" font-size="18" text-anchor="middle" class="t-acc">Kernel B</text>
    <rect x="540" y="190" width="200" height="50" class="f-panel s-fg"/>
    <text x="640" y="222" font-size="18" text-anchor="middle">Kernel C</text>
    <line x1="160" y1="240" x2="160" y2="300" class="s-mid"/>
    <line x1="400" y1="240" x2="400" y2="300" class="s-mid"/>
    <line x1="640" y1="240" x2="640" y2="300" class="s-mid"/>
    <rect x="60" y="300" width="680" height="60" class="f-panel s-fg"/>
    <text x="400" y="337" font-size="18" text-anchor="middle">Hypervisor: hardware boundary</text>
    <rect x="300" y="80" width="200" height="70" class="s-acc" fill="none" stroke-width="3"/>
    <rect x="300" y="190" width="200" height="50" class="s-acc" fill="none" stroke-width="3"/>
    <line x1="280" y1="66" x2="280" y2="300" class="s-acc" stroke-width="3"/>
    <line x1="520" y1="66" x2="520" y2="300" class="s-acc" stroke-width="3"/>
    <text x="400" y="408" font-size="20" text-anchor="middle" class="t-acc">The flaw stays inside sandbox B</text>
  </g>
</svg>
