<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <text x="24" y="40" font-size="20">What the judge awards the employee</text>
  <line x1="300" y1="70" x2="300" y2="360" class="s-line" stroke-width="1"/>
  <line x1="414" y1="70" x2="414" y2="360" class="s-line" stroke-width="1"/>
  <line x1="528" y1="70" x2="528" y2="360" class="s-line" stroke-width="1"/>
  <line x1="642" y1="70" x2="642" y2="360" class="s-line" stroke-width="1"/>
  <line x1="756" y1="70" x2="756" y2="360" class="s-line" stroke-width="1"/>
  <line x1="300" y1="360" x2="770" y2="360" class="s-fg" stroke-width="2"/>
  <text x="300" y="386" text-anchor="middle" font-size="16" class="t-mid">0</text>
  <text x="414" y="386" text-anchor="middle" font-size="16" class="t-mid">3</text>
  <text x="528" y="386" text-anchor="middle" font-size="16" class="t-mid">6</text>
  <text x="642" y="386" text-anchor="middle" font-size="16" class="t-mid">9</text>
  <text x="756" y="386" text-anchor="middle" font-size="16" class="t-mid">12</text>
  <text x="528" y="420" text-anchor="middle" font-size="16" class="t-mid">Damages (months of gross salary)</text>
  <g data-step="1">
    <text x="24" y="112" font-size="18">No real and serious</text>
    <text x="24" y="136" font-size="18">cause (5 years)</text>
    <rect x="414" y="100" width="114" height="36" class="f-mid s-fg" stroke-width="2"/>
    <text x="540" y="124" font-size="16" class="t-mid">3 to 6 months</text>
  </g>
  <g data-step="2">
    <text x="24" y="224" font-size="18">Void dismissal</text>
    <rect x="528" y="200" width="200" height="36" class="f-mid s-fg" stroke-width="2"/>
    <polygon points="728,192 728,244 762,218" class="f-mid s-fg" stroke-width="2"/>
    <text x="528" y="188" font-size="16" class="t-mid">at least 6 months, no cap</text>
  </g>
  <g data-step="3">
    <text x="24" y="296" font-size="18" class="t-acc">Real and serious</text>
    <text x="24" y="320" font-size="18" class="t-acc">cause</text>
    <circle cx="300" cy="302" r="9" class="f-acc"/>
    <text x="322" y="308" font-size="18" class="t-acc">0 months: the director's case</text>
  </g>
</svg>
