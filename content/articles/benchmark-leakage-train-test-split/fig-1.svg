<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <text x="40" y="70" font-size="18" class="t-mid">Jeu de données</text>
  <rect x="40" y="90" width="720" height="50" class="f-panel s-fg" stroke-width="2"/>
  <text x="400" y="121" font-size="17" text-anchor="middle" data-hide="2">Toutes les données, avec leurs réponses</text>
  <g data-step="2">
    <rect x="688" y="90" width="72" height="50" class="f-mid s-fg" stroke-width="2"/>
    <text x="364" y="168" font-size="17" text-anchor="middle">Entraînement : 90 %</text>
    <text x="760" y="168" font-size="17" text-anchor="end">Test : 10 %</text>
  </g>
  <g data-step="3">
    <path d="M364,180 L364,228" fill="none" class="s-fg" stroke-width="2"/>
    <polygon points="357,226 371,226 364,238" class="f-fg"/>
    <text x="382" y="212" font-size="17" class="t-mid">il apprend ici</text>
    <rect x="264" y="240" width="200" height="60" rx="6" class="f-panel s-fg" stroke-width="2"/>
    <text x="364" y="277" font-size="20" text-anchor="middle">Modèle</text>
  </g>
  <g data-step="4">
    <path d="M724,180 L724,270 L478,270" fill="none" class="s-fg" stroke-width="2"/>
    <polygon points="478,263 478,277 466,270" class="f-fg"/>
    <text x="712" y="258" font-size="17" text-anchor="end" class="t-mid">questions du test</text>
    <path d="M364,300 L364,342" fill="none" class="s-fg" stroke-width="2"/>
    <polygon points="357,340 371,340 364,352" class="f-fg"/>
    <text x="364" y="380" font-size="20" text-anchor="middle">Score mesuré</text>
  </g>
  <g data-step="5">
    <path d="M724,86 C724,46 560,46 560,76" fill="none" class="s-acc" stroke-width="3" stroke-dasharray="8 6"/>
    <polygon points="552,75 568,75 560,89" class="f-acc"/>
    <text x="642" y="44" font-size="18" text-anchor="middle" class="t-acc">fuite</text>
    <text x="364" y="412" font-size="18" text-anchor="middle" class="t-acc">gonflé par les réponses déjà vues</text>
  </g>
</svg>
