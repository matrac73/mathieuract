<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <text x="40" y="60" font-size="17">Engine: 200 documents returned</text>
  <line x1="40" y1="96" x2="360" y2="96" class="s-fg" stroke-width="12" stroke-dasharray="12 4"/>
  <line x1="40" y1="112" x2="360" y2="112" class="s-fg" stroke-width="12" stroke-dasharray="12 4"/>
  <line x1="40" y1="128" x2="360" y2="128" class="s-fg" stroke-width="12" stroke-dasharray="12 4"/>
  <line x1="40" y1="144" x2="360" y2="144" class="s-fg" stroke-width="12" stroke-dasharray="12 4"/>
  <line x1="40" y1="160" x2="360" y2="160" class="s-fg" stroke-width="12" stroke-dasharray="12 4"/>
  <line x1="40" y1="176" x2="360" y2="176" class="s-fg" stroke-width="12" stroke-dasharray="12 4"/>
  <line x1="40" y1="192" x2="360" y2="192" class="s-fg" stroke-width="12" stroke-dasharray="12 4"/>
  <line x1="40" y1="208" x2="360" y2="208" class="s-fg" stroke-width="12" stroke-dasharray="12 4"/>
  <line x1="40" y1="224" x2="200" y2="224" class="s-fg" stroke-width="12" stroke-dasharray="12 4"/>
  <g data-hide="2">
    <line x1="200" y1="224" x2="360" y2="224" class="s-fg" stroke-width="12" stroke-dasharray="12 4"/>
    <line x1="40" y1="240" x2="360" y2="240" class="s-fg" stroke-width="12" stroke-dasharray="12 4"/>
  </g>
  <g data-step="2">
    <line x1="200" y1="224" x2="360" y2="224" class="s-mid" stroke-width="12" stroke-dasharray="12 4"/>
    <line x1="40" y1="240" x2="360" y2="240" class="s-mid" stroke-width="12" stroke-dasharray="12 4"/>
    <text x="40" y="284" font-size="17">170 relevant, 30 not (in grey)</text>
    <text x="40" y="312" font-size="17">precision = 170 / 200 = 0.85</text>
  </g>
  <g data-step="3">
    <text x="440" y="60" font-size="17">ChatGPT: a single answer</text>
    <rect x="440" y="86" width="320" height="164" class="f-panel s-mid" stroke-width="2"/>
    <line x1="460" y1="118" x2="740" y2="118" class="s-mid" stroke-width="6"/>
    <line x1="460" y1="143" x2="740" y2="143" class="s-mid" stroke-width="6"/>
    <line x1="460" y1="168" x2="740" y2="168" class="s-mid" stroke-width="6"/>
    <line x1="460" y1="193" x2="740" y2="193" class="s-mid" stroke-width="6"/>
    <line x1="460" y1="218" x2="620" y2="218" class="s-mid" stroke-width="6"/>
    <text x="440" y="284" font-size="17">All sentences look alike</text>
  </g>
  <g data-step="4">
    <line x1="560" y1="168" x2="680" y2="168" class="s-acc" stroke-width="6"/>
    <text x="440" y="312" font-size="17" class="t-acc">One false claim, no warning</text>
    <text x="440" y="364" font-size="18" class="t-acc">Here, check everything</text>
    <text x="40" y="364" font-size="18" class="t-acc">Here, errors can be counted</text>
  </g>
</svg>
