  <text x="630" y="56" font-size="17" text-anchor="middle" class="t-mid">Looks ahead before acting</text>
  <line x1="40" y1="76" x2="760" y2="76" class="s-mid" stroke-width="2"/>
  <line x1="40" y1="146" x2="760" y2="146" class="s-line"/>
  <line x1="40" y1="216" x2="760" y2="216" class="s-line"/>
  <line x1="40" y1="286" x2="760" y2="286" class="s-line"/>
  <text x="40" y="118" font-size="18">Dynamic programming</text>
  <text x="400" y="118" font-size="18" text-anchor="middle">given</text>
  <text x="630" y="118" font-size="18" text-anchor="middle">yes</text>
