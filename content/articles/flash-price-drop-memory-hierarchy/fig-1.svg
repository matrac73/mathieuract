<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <text x="400" y="40" font-size="20" text-anchor="middle">Prix au comptant, novembre 2026</text>
  <text x="24" y="80" font-size="16" class="t-mid">Variation du prix (%)</text>
  <line x1="140" y1="110" x2="140" y2="400" class="s-mid" stroke-width="2"/>
  <line x1="140" y1="110" x2="760" y2="110" class="s-fg" stroke-width="2"/>
  <line x1="140" y1="222" x2="760" y2="222" class="s-line" stroke-width="1"/>
  <line x1="140" y1="334" x2="760" y2="334" class="s-line" stroke-width="1"/>
  <text x="128" y="116" font-size="16" text-anchor="end" class="t-mid">0</text>
  <text x="128" y="228" font-size="16" text-anchor="end" class="t-mid">−10</text>
  <text x="128" y="340" font-size="16" text-anchor="end" class="t-mid">−20</text>
  <g data-step="2">
    <text x="310" y="98" font-size="18" text-anchor="middle">Flash NAND</text>
    <rect x="250" y="110" width="120" height="224" class="f-mid"/>
    <text x="310" y="364" font-size="18" text-anchor="middle">−20 % en deux semaines</text>
  </g>
  <g data-step="3">
    <text x="590" y="98" font-size="18" text-anchor="middle">DRAM DDR4</text>
    <rect x="530" y="110" width="120" height="16" class="f-acc"/>
    <text x="590" y="154" font-size="18" text-anchor="middle" class="t-acc">−1,43 % en une semaine</text>
  </g>
  <g data-step="4">
    <text x="590" y="250" font-size="18" text-anchor="middle" class="t-acc">DRAM sous contrat :</text>
    <text x="590" y="276" font-size="18" text-anchor="middle" class="t-acc">+8 % prévu ce trimestre</text>
  </g>
</svg>
