<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <text x="24" y="40" font-size="18" class="t-mid">€10,000 car, depreciated over 5 years</text>
  <text x="24" y="106" font-size="18">Cash</text>
  <line x1="170" y1="100" x2="770" y2="100" class="s-mid" stroke-width="2"/>
  <text x="24" y="286" font-size="18">Profit</text>
  <line x1="170" y1="280" x2="770" y2="280" class="s-mid" stroke-width="2"/>
  <text x="24" y="366" font-size="16" class="t-mid">Year</text>
  <text x="220" y="366" font-size="16" text-anchor="middle" class="t-mid">0</text>
  <text x="320" y="366" font-size="16" text-anchor="middle" class="t-mid">1</text>
  <text x="420" y="366" font-size="16" text-anchor="middle" class="t-mid">2</text>
  <text x="520" y="366" font-size="16" text-anchor="middle" class="t-mid">3</text>
  <text x="620" y="366" font-size="16" text-anchor="middle" class="t-mid">4</text>
  <text x="720" y="366" font-size="16" text-anchor="middle" class="t-mid">5</text>
  <g data-step="1">
    <rect x="195" y="100" width="50" height="120" class="f-fg"/>
    <text x="257" y="168" font-size="18">−€10,000 paid</text>
  </g>
  <g data-step="2">
    <text x="220" y="270" font-size="18" text-anchor="middle">€0</text>
  </g>
  <g data-step="3">
    <rect x="295" y="280" width="50" height="24" class="f-mid"/>
    <rect x="395" y="280" width="50" height="24" class="f-mid"/>
    <rect x="495" y="280" width="50" height="24" class="f-mid"/>
    <rect x="595" y="280" width="50" height="24" class="f-mid"/>
    <rect x="695" y="280" width="50" height="24" class="f-mid"/>
    <text x="320" y="326" font-size="16" text-anchor="middle">−2,000</text>
    <text x="420" y="326" font-size="16" text-anchor="middle">−2,000</text>
    <text x="520" y="326" font-size="16" text-anchor="middle">−2,000</text>
    <text x="620" y="326" font-size="16" text-anchor="middle">−2,000</text>
    <text x="720" y="326" font-size="16" text-anchor="middle">−2,000</text>
  </g>
  <g data-step="4">
    <text x="400" y="418" font-size="20" text-anchor="middle" class="t-acc">Same total: €10,000 = 5 × €2,000</text>
  </g>
</svg>
