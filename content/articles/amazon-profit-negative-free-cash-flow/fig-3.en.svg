<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <text x="24" y="36" font-size="18" class="t-mid">Amazon, $ billions over 12 months</text>
  <rect x="24" y="54" width="16" height="16" class="f-fg"/>
  <text x="48" y="68" font-size="16">Equipment purchases</text>
  <rect x="250" y="54" width="16" height="16" class="f-mid"/>
  <text x="274" y="68" font-size="16">Depreciation</text>
  <line x1="60" y1="360" x2="770" y2="360" class="s-mid" stroke-width="2"/>
  <text x="230" y="390" font-size="16" text-anchor="middle" class="t-mid">to end Sept. 2025</text>
  <text x="530" y="390" font-size="16" text-anchor="middle" class="t-mid">to end Sept. 2026</text>
  <g data-step="1">
    <rect x="130" y="216" width="90" height="144" class="f-fg"/>
    <text x="175" y="206" font-size="18" text-anchor="middle">120.1</text>
    <rect x="240" y="286" width="90" height="74" class="f-mid"/>
    <text x="285" y="276" font-size="18" text-anchor="middle">61.9</text>
  </g>
  <g data-step="2">
    <rect x="430" y="102" width="90" height="258" class="f-fg"/>
    <text x="475" y="94" font-size="18" text-anchor="middle">215.2</text>
  </g>
  <g data-step="3">
    <rect x="540" y="265" width="90" height="95" class="f-mid"/>
    <text x="585" y="255" font-size="18" text-anchor="middle">79.4</text>
  </g>
  <g data-step="4">
    <path d="M 648 102 L 660 102 L 660 265 L 648 265" fill="none" class="s-acc" stroke-width="3"/>
    <text x="672" y="178" font-size="16" class="t-acc">gap ≈ 136</text>
    <text x="672" y="202" font-size="16" class="t-acc">still to be</text>
    <text x="672" y="222" font-size="16" class="t-acc">depreciated</text>
  </g>
</svg>
